plugins {
    id 'java-library'
    id 'com.diffplug.spotless' version '8.10.1'
}

group = 'org.fakebelieve.tomcat'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

// Match this to the Tomcat version you're actually deploying to.
def tomcatVersion = '9.0.98'

dependencies {
    // "compileOnly" because at runtime these classes are provided by
    // Tomcat itself (they live in $CATALINA_HOME/lib) — we don't want
    // to bundle a second copy of Tomcat's own classes into our jar.
    compileOnly "org.apache.tomcat:tomcat-catalina:${tomcatVersion}"
    compileOnly "org.apache.tomcat:tomcat-coyote:${tomcatVersion}"
    compileOnly "org.apache.tomcat:tomcat-util:${tomcatVersion}"

    testImplementation "org.apache.tomcat:tomcat-catalina:${tomcatVersion}"
    testImplementation "org.apache.tomcat:tomcat-coyote:${tomcatVersion}"
    testImplementation "org.apache.tomcat:tomcat-util:${tomcatVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Produces a plain jar containing just our two small classes.
// Copy build/libs/tomcat-ip-filter-1.0.0.jar into $CATALINA_HOME/lib.
jar {
    archiveBaseName = 'tomcat-ip-filter'
}

tasks.register('installToTomcat', Copy) {
    description = 'Copies the built jar into $CATALINA_HOME/lib'
    dependsOn jar
    from jar.archiveFile
    into providers.environmentVariable('CATALINA_HOME').map { "$it/lib" }
        .getOrElse('/opt/tomcat/lib')
}

spotless {
    format 'misc', {
        target '*.gradle', '*.md', '.gitignore'
        trimTrailingWhitespace()
        leadingTabsToSpaces(2)
        endWithNewline()
    }
    java {
        target "src/**/*.java"
        palantirJavaFormat()
    }
}
